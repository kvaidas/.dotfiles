[window]
startup_mode  = "Fullscreen"
option_as_alt = "Both"

[[keyboard.bindings]]
key    = "V"
mods   = "Super"
action = "Paste"

[[keyboard.bindings]]
key    = "C"
mods   = "Super"
action = "Copy"

[mouse]
hide_when_typing = true

[font]
size = 24

[font.normal]
family = "FiraCode Nerd Font"

# Modified Tango from clcode.net
[colors.primary]
background = '#000000'
foreground = '#d3d7cf'

[colors.normal]
black   = '#2e3436'
red     = '#cc0000'
green   = '#73d216'
yellow  = '#edd400'
blue    = '#3465a4'
magenta = '#75507b'
cyan    = '#06989a'
white   = '#d3d7cf'

[colors.bright]
black   = '#2e3436'
red     = '#ef2929'
green   = '#8ae234'
yellow  = '#fce94f'
blue    = '#729fcf'
magenta = '#ad7fa8'
cyan    = '#34e2e2'
white   = '#eeeeec'